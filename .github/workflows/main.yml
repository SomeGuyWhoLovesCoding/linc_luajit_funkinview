# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  HLWindowsBuild:
    runs-on: windows-latest
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      
      # Cache haxelib dependencies
      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: C:/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/build.hxml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-
      
      # Runs a set of commands using the runners shell
      - name: Install required haxelibs
        run: |
          haxelib setup C:/haxelib
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib git hxcpp https://github.com/SomeGuyWhoLovesCoding/hxcpp-sgwlfnf.git --quiet
          haxelib git linc_luajit_funkinview https://github.com/SomeGuyWhoLovesCoding/linc_luajit_funkinview.git --quiet
        shell: cmd
      
      - name: Compile
        run: |
          haxelib run hxcpp "linc/linc_lua_hl.xml"
      
      - name: Publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'luajit_funkinview-windows-hl'
          path: hashlinkBuildXmls/hl/*.hdll
          if-no-files-found: error
          retention-days: 7

  HLLinuxBuild:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      
      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/build.hxml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-
      
      - name: Install required Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make
          bash ./setup/linux.bash
      
      # Build LuaJIT from your local source with -fPIC
      - name: Build bundled LuaJIT with -fPIC
        run: |
          cd lib/lua
          make TARGET_CFLAGS="-fPIC"
          # Create lib directory if it doesn't exist
          mkdir -p lib/linux
          # Copy the built library to where your build.xml expects it
          cp src/libluajit.a lib/linux/
          cp src/libluajit.so lib/linux/ 2>/dev/null || true
          echo "✓ Built LuaJIT with -fPIC support"
      
      - name: Install required haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib git hxcpp https://github.com/SomeGuyWhoLovesCoding/hxcpp-sgwlfnf.git --quiet
          haxelib git linc_luajit_funkinview https://github.com/SomeGuyWhoLovesCoding/linc_luajit_funkinview.git --quiet
      
      - name: Compile
        run: |
          haxelib run hxcpp "linc/linc_lua_hl.xml"
      
      - name: Publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'luajit_funkinview-linux-hl'
          path: hashlinkBuildXmls/hl_linux/*.hdll
          if-no-files-found: error
          retention-days: 7