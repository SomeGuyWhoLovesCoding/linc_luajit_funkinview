# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  HLWindowsBuild:
    runs-on: windows-latest
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      
      # Setup Visual Studio environment for 64-bit
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      
      - name: Setup 64-bit environment
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        shell: cmd
      
      # Cache haxelib dependencies
      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: C:/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/build.hxml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-
      
      # Runs a set of commands using the runners shell
      - name: Install required haxelibs
        run: |
          haxelib setup C:/haxelib
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install hxcpp --quiet
          haxelib git linc_luajit_funkinview https://github.com/SomeGuyWhoLovesCoding/linc_luajit_funkinview.git --quiet
        shell: cmd
      
      - name: Compile 64-bit
        run: |
          set HXCPP_M64=1
          haxelib run hxcpp "linc/linc_lua_hl.xml" -D HXCPP_M64
        shell: cmd
      
      - name: Debug - Check for output files
        run: |
          echo "Checking for .hdll files..."
          dir /s *.hdll
          echo ""
          echo "Checking hashlinkBuildXmls/hl/"
          dir hashlinkBuildXmls\hl\
        shell: cmd
        continue-on-error: true
      
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'luajit_funkinview-windows-hl'
          path: |
            hashlinkBuildXmls/hl/*.hdll
            hdlls/windows/*.hdll
            **/*.hdll
          if-no-files-found: warn
          retention-days: 7

  HLLinuxBuild:
    runs-on: ubuntu-latest
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      
      # Cache haxelib dependencies
      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/build.hxml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-
      
      # Runs a set of commands using the runners shell
      - name: Install required Linux libraries
        run: |
          bash ./setup/linux.bash
        shell: bash
      
      - name: Install required haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install hxcpp --quiet
          haxelib git linc_luajit_funkinview https://github.com/SomeGuyWhoLovesCoding/linc_luajit_funkinview.git --quiet
      
      - name: Compile 64-bit
        run: |
          export HXCPP_M64=1
          haxelib run hxcpp "linc/linc_lua_hl.xml" -D HXCPP_M64
        shell: bash
      
      - name: Debug - Check for output files
        run: |
          echo "Checking for .hdll files..."
          find . -name "*.hdll" -type f
          echo ""
          echo "Checking hashlinkBuildXmls/hl/"
          ls -la hashlinkBuildXmls/hl/ 2>/dev/null || echo "Directory doesn't exist"
        shell: bash
        continue-on-error: true
      
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'luajit_funkinview-linux-hl'
          path: |
            hashlinkBuildXmls/hl/*.hdll
            hdlls/linux/*.hdll
            **/*.hdll
          if-no-files-found: warn
          retention-days: 7